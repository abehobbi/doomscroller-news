name: Retrieve isolated five-lane trial artifact

on:
  push:
    branches:
      - codex/news-global-discovery-test
    paths:
      - .github/workflows/retrieve-five-lane-trial.yml

permissions:
  actions: read
  contents: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/news-global-discovery-test
      - name: Download the already-completed trial artifact
        uses: actions/download-artifact@v5
        with:
          name: news-five-lane-generation-trial-38037266700
          path: experiments/news-global-discovery/review-output-five-lane/generated-trial
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38037266700
      - name: Preserve the review on the feature branch
        shell: bash
        run: |
          git config user.name doomscroller-news-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f experiments/news-global-discovery/review-output-five-lane/generated-trial/TRIAL_REPORT.json
          git add -f experiments/news-global-discovery/review-output-five-lane/generated-trial/TRIAL_REVIEW.md
          git commit -m "Record isolated five-lane generation trial"
          git push
