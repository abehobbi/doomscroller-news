name: Run isolated News generation trial

on:
  workflow_dispatch:
  push:
    branches:
      - codex/news-editorial-selection
    paths:
      - experiments/news-global-discovery/FINALIST_GENERATION_TRIGGER
      - experiments/news-global-discovery/FINALIST_REPAIR_TRIGGER

concurrency:
  group: news-five-lane-generation-trial
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify isolated News tests
        run: npm run news:test
      - name: Verify saved Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Generate source-and-image-cleared finalists
        if: ${{ !hashFiles('experiments/news-global-discovery/FINALIST_REPAIR_TRIGGER') }}
        run: >-
          node experiments/news-global-discovery/writer-shortlist-trial.mjs
          --shortlist experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/readiness/GENERATION_READY_SHORTLIST.json
          --verification experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/readiness/SOURCE_VERIFICATION_MERGED.json
          --all-selected
          --output-dir experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/generated-cards
      - name: Repair only quarantined finalists
        if: ${{ hashFiles('experiments/news-global-discovery/FINALIST_REPAIR_TRIGGER') != '' }}
        run: >-
          node experiments/news-global-discovery/writer-shortlist-trial.mjs
          --shortlist experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/readiness/GENERATION_READY_SHORTLIST.json
          --verification experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/readiness/SOURCE_VERIFICATION_MERGED.json
          --event-id qualified-event-015
          --event-id qualified-event-138
          --event-id qualified-event-029
          --event-id qualified-event-038
          --event-id qualified-event-044
          --output-dir experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/generated-card-repairs
      - name: Upload the review and exact diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: news-finalist-cards-${{ github.run_id }}
          path: |
            experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/generated-cards
            experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/generated-card-repairs
          retention-days: 14
          if-no-files-found: error
