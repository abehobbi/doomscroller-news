name: Run isolated five-lane News generation trial

on:
  workflow_dispatch:

concurrency:
  group: news-five-lane-generation-trial
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify isolated News tests
        run: npm run news:test
      - name: Verify saved Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Regenerate only corrected and replacement cards
        run: >-
          node experiments/news-global-discovery/writer-shortlist-trial.mjs
          --shortlist experiments/news-global-discovery/review-output-shadow-2026-10-11/shortlist-complete/WRITER_READY_SHORTLIST.json
          --verification experiments/news-global-discovery/review-output-shadow-2026-10-11/verification/TARGETED_VERIFICATION.json
          --verification experiments/news-global-discovery/review-output-shadow-2026-10-11/verification/GAP_RECOVERY_VERIFICATION.json
          --verification experiments/news-global-discovery/review-output-shadow-2026-10-11/verification/REGION_RECOVERY_VERIFICATION.json
          --context experiments/news-global-discovery/review-output-shadow-2026-10-11/corrections/TARGETED_CONTEXT.json
          --event-id qualified-event-068
          --event-id qualified-event-025
          --output-dir experiments/news-global-discovery/review-output-shadow-2026-10-11/writing/final-targeted
      - name: Upload the review and exact diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: news-final-targeted-${{ github.run_id }}
          path: experiments/news-global-discovery/review-output-shadow-2026-10-11/writing/final-targeted
          retention-days: 14
          if-no-files-found: error
