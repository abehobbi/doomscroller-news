name: Run isolated News generation trial

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: Shadow pipeline stage to run
        required: true
        type: choice
        default: fresh-qualification
        options:
          - fresh-qualification
          - recall-rehearsal
      scan:
        description: Discovery lanes for a fresh qualification run
        required: true
        type: choice
        default: full
        options:
          - full
          - major
          - depth

concurrency:
  group: news-five-lane-generation-trial
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fresh-qualification:
    if: inputs.pipeline == 'fresh-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      RUN_ROOT: artifacts/news-shadow-runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify isolated News tests
        run: npm run news:test
      - name: Verify saved discovery credential is available
        shell: bash
        run: test -n "$EXA_API_KEY"
      - name: Create a fresh run workspace
        shell: bash
        run: mkdir -p "$RUN_ROOT/discovery" "$RUN_ROOT/publisher" "$RUN_ROOT/combined" "$RUN_ROOT/selection" "$RUN_ROOT/verification" "$RUN_ROOT/repair" "$RUN_ROOT/verified" "$RUN_ROOT/gap/discovery" "$RUN_ROOT/gap/selection" "$RUN_ROOT/gap/verification" "$RUN_ROOT/gap/repair" "$RUN_ROOT/gap/verified" "$RUN_ROOT/merged"
      - name: Discover current candidates across the requested lanes
        run: >-
          node experiments/news-global-discovery/exa-five-lane-scout.mjs
          --scan ${{ inputs.scan }}
          --days 3
          --results-per-query 10
          --max-queries 20
          --output ${{ env.RUN_ROOT }}/discovery/EXA_DISCOVERY.json
      - name: Collect the free publisher-feed safety net
        run: >-
          node experiments/news-global-discovery/source-seed-depth-scout.mjs
          --output-dir ${{ env.RUN_ROOT }}/publisher
      - name: Merge open-web and publisher-feed discovery
        run: >-
          node experiments/news-global-discovery/merge-discovery-candidates.mjs
          --exa ${{ env.RUN_ROOT }}/discovery/EXA_DISCOVERY.json
          --source ${{ env.RUN_ROOT }}/publisher/SOURCE_SEED_BATCH.json
          --output ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json
      - name: Deduplicate, rank, and balance the candidate pool
        run: >-
          node experiments/news-global-discovery/select-five-lane-edition.mjs
          --input ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json
          --count 65
          --output-dir ${{ env.RUN_ROOT }}/selection
      - name: Verify sources, freshness, event identity, and publisher images
        run: >-
          node experiments/news-global-discovery/verify-unified-shortlist.mjs
          --input ${{ env.RUN_ROOT }}/selection/ANSWER_KEY.json
          --pool ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json
          --output-dir ${{ env.RUN_ROOT }}/verification
      - name: Attempt bounded repair for otherwise useful blocked stories
        run: >-
          node experiments/news-global-discovery/repair-unified-shortlist.mjs
          --input ${{ env.RUN_ROOT }}/verification/VERIFICATION_REPORT.json
          --pool ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json
          --maximum 12
          --output-dir ${{ env.RUN_ROOT }}/repair
      - name: Assemble and rank the source-ready provisional edition
        run: >-
          node experiments/news-global-discovery/assemble-verified-edition.mjs
          --shortlist ${{ env.RUN_ROOT }}/selection/ANSWER_KEY.json
          --verification ${{ env.RUN_ROOT }}/verification/VERIFICATION_REPORT.json
          --repair ${{ env.RUN_ROOT }}/repair/SOURCE_REPAIR_REPORT.json
          --output-dir ${{ env.RUN_ROOT }}/verified
      - name: Plan and run discovery only for measured gaps
        id: gap
        run: >-
          node experiments/news-global-discovery/exa-dynamic-gap-recovery.mjs
          --edition ${{ env.RUN_ROOT }}/verified/VERIFIED_EDITION.json
          --discovery ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json
          --results-per-query 10
          --max-queries 8
          --output ${{ env.RUN_ROOT }}/gap/discovery/EXA_GAP_DISCOVERY.json
      - name: Select gap-recovery candidates
        if: steps.gap.outputs.query_count != '0'
        run: >-
          node experiments/news-global-discovery/select-five-lane-edition.mjs
          --input ${{ env.RUN_ROOT }}/gap/discovery/EXA_GAP_DISCOVERY.json
          --count 30
          --output-dir ${{ env.RUN_ROOT }}/gap/selection
      - name: Verify gap-recovery sources and images
        if: steps.gap.outputs.query_count != '0'
        run: >-
          node experiments/news-global-discovery/verify-unified-shortlist.mjs
          --input ${{ env.RUN_ROOT }}/gap/selection/ANSWER_KEY.json
          --pool ${{ env.RUN_ROOT }}/gap/discovery/EXA_GAP_DISCOVERY.json
          --output-dir ${{ env.RUN_ROOT }}/gap/verification
      - name: Repair the strongest blocked gap candidates
        if: steps.gap.outputs.query_count != '0'
        run: >-
          node experiments/news-global-discovery/repair-unified-shortlist.mjs
          --input ${{ env.RUN_ROOT }}/gap/verification/VERIFICATION_REPORT.json
          --pool ${{ env.RUN_ROOT }}/gap/discovery/EXA_GAP_DISCOVERY.json
          --maximum 12
          --output-dir ${{ env.RUN_ROOT }}/gap/repair
      - name: Assemble verified gap additions
        if: steps.gap.outputs.query_count != '0'
        run: >-
          node experiments/news-global-discovery/assemble-verified-edition.mjs
          --shortlist ${{ env.RUN_ROOT }}/gap/selection/ANSWER_KEY.json
          --verification ${{ env.RUN_ROOT }}/gap/verification/VERIFICATION_REPORT.json
          --repair ${{ env.RUN_ROOT }}/gap/repair/SOURCE_REPAIR_REPORT.json
          --output-dir ${{ env.RUN_ROOT }}/gap/verified
      - name: Merge independently verified recovery cards
        if: steps.gap.outputs.query_count != '0'
        run: >-
          node experiments/news-global-discovery/merge-verified-editions.mjs
          --input ${{ env.RUN_ROOT }}/verified/VERIFIED_EDITION.json
          --input ${{ env.RUN_ROOT }}/gap/verified/VERIFIED_EDITION.json
          --output-dir ${{ env.RUN_ROOT }}/merged
      - name: Preserve the original edition when no gaps exist
        if: steps.gap.outputs.query_count == '0'
        shell: bash
        run: cp "$RUN_ROOT/verified/VERIFIED_EDITION.json" "$RUN_ROOT/merged/MERGED_VERIFIED_EDITION.json"
      - name: Upload the complete fresh-run evidence trail
        uses: actions/upload-artifact@v4
        with:
          name: news-fresh-qualification-${{ github.run_id }}
          path: ${{ env.RUN_ROOT }}
          retention-days: 14
          if-no-files-found: error

  generate-trial:
    if: inputs.pipeline == 'recall-rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify isolated News tests
        run: npm run news:test
      - name: Verify saved Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Select strong distinct recall promotions
        run: >-
          node experiments/news-global-discovery/select-recall-promotions.mjs
          --scores experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/editorial/run-38238358126/scored/EDITORIAL_SCORES.json
          --classification experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/qualified/QUALIFIED_RECALL_CLASSIFICATION.json
          --output-dir experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/automatic
      - name: Prepare automatically promoted recall candidates
        run: >-
          node experiments/news-global-discovery/prepare-recall-writer-trial.mjs
          --edition experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/editorial/READY_EDITION.json
          --verification experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/verified/VERIFICATION_REPORT.json
          --repair experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/repaired/SOURCE_REPAIR_REPORT.json
          --promotions experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/automatic/RECALL_PROMOTIONS.json
          --output-dir experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer
      - name: Generate source-and-image-cleared recall finalists
        run: >-
          node experiments/news-global-discovery/writer-shortlist-trial.mjs
          --shortlist experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer/WRITER_SHORTLIST.json
          --verification experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer/WRITER_VERIFICATION.json
          --all-selected
          --output-dir experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer/generated
      - name: Assemble and audit the recall-expanded shadow edition
        run: >-
          node experiments/news-global-discovery/assemble-recall-expanded-edition.mjs
          --baseline experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/expanded-edition/RECALL_EXPANDED_EDITION.json
          --writer-report experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer/generated/TRIAL_REPORT.json
          --shortlist experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer/WRITER_SHORTLIST.json
          --output-dir experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/automatic/final
      - name: Upload the review and exact diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: news-recall-writer-${{ github.run_id }}
          path: |
            experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer
            experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/automatic
          retention-days: 14
          if-no-files-found: error
