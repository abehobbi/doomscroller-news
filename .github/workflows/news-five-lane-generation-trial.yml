name: Run isolated News generation trial

on:
  workflow_dispatch:

concurrency:
  group: news-five-lane-generation-trial
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify isolated News tests
        run: npm run news:test
      - name: Verify saved Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Select strong distinct recall promotions
        run: >-
          node experiments/news-global-discovery/select-recall-promotions.mjs
          --scores experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/editorial/run-38238358126/scored/EDITORIAL_SCORES.json
          --classification experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/qualified/QUALIFIED_RECALL_CLASSIFICATION.json
          --output-dir experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/automatic
      - name: Prepare automatically promoted recall candidates
        run: >-
          node experiments/news-global-discovery/prepare-recall-writer-trial.mjs
          --edition experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/editorial/READY_EDITION.json
          --verification experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/verified/VERIFICATION_REPORT.json
          --repair experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/repaired/SOURCE_REPAIR_REPORT.json
          --promotions experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/automatic/RECALL_PROMOTIONS.json
          --output-dir experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer
      - name: Generate source-and-image-cleared recall finalists
        run: >-
          node experiments/news-global-discovery/writer-shortlist-trial.mjs
          --shortlist experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer/WRITER_SHORTLIST.json
          --verification experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer/WRITER_VERIFICATION.json
          --all-selected
          --output-dir experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer/generated
      - name: Assemble and audit the recall-expanded shadow edition
        run: >-
          node experiments/news-global-discovery/assemble-recall-expanded-edition.mjs
          --baseline experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/expanded-edition/RECALL_EXPANDED_EDITION.json
          --writer-report experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer/generated/TRIAL_REPORT.json
          --shortlist experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer/WRITER_SHORTLIST.json
          --output-dir experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/automatic/final
      - name: Upload the review and exact diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: news-recall-writer-${{ github.run_id }}
          path: experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/writer
          retention-days: 14
          if-no-files-found: error
