name: Update Doomscroller News daily edition

on:
  workflow_dispatch:
    inputs:
      scan:
        description: Discovery lanes to scan
        required: true
        type: choice
        default: full
        options: [full, major, depth]
      window_hours:
        description: Rolling publication window for this shadow edition
        required: true
        type: choice
        default: '24'
        options: ['12', '24', '72']
      publish_dataset:
        description: Publish only after every mandatory release-safety check passes
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/news-watchdog'
  schedule:
    # A cheap watchdog runs away from the top of the hour. The plan job exits
    # before provider use unless a Toronto edition is genuinely due and absent.
    # Frequent triggers tolerate GitHub scheduler delays; the release lock and
    # workflow concurrency prevent duplicate paid discovery runs.
    - cron: '7,22,37,52 * * * *'

concurrency:
  # v2 retires the lock held by the pre-handoff workflow. A completed runner
  # can occasionally remain stale in GitHub's run metadata after every step
  # has succeeded; that old status must not block the repaired watchdog.
  group: news-daily-edition-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      scan: ${{ steps.plan.outputs.scan }}
      window_hours: ${{ steps.plan.outputs.windowHours }}
      publish: ${{ steps.plan.outputs.publish }}
      edition_mode: ${{ steps.plan.outputs.editionMode }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs are created from an event SHA that can predate a
          # recently published edition. Always read the latest branch state so
          # redundant watchdog triggers see the current release lock.
          ref: ${{ github.ref_name }}
      - id: latest
        name: Read latest committed edition timestamp
        shell: bash
        run: |
          value="$(node -e "const fs=require('fs');try{process.stdout.write(JSON.parse(fs.readFileSync('public/news/beta-control.json','utf8')).updatedAt||'')}catch{}")"
          printf 'publishedAt=%s\n' "$value" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Resolve Toronto schedule and release lock
        run: >-
          node scripts/news/resolve-news-schedule.mjs
          --event "${{ github.event_name == 'push' && 'schedule' || github.event_name }}"
          --cron "${{ github.event.schedule || 'watchdog' }}"
          --manual-scan "${{ inputs.scan }}"
          --manual-window "${{ inputs.window_hours }}"
          --manual-publish "${{ inputs.publish_dataset }}"
          --production-enabled "${{ github.event_name == 'schedule' || github.event_name == 'push' || vars.NEWS_PRODUCTION_ENABLED == 'true' }}"
          --last-published-at "${{ steps.latest.outputs.publishedAt }}"
          --output "$GITHUB_OUTPUT"

  shadow:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
      RUN_ROOT: artifacts/news-unattended-shadow/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Match the plan job's current branch state instead of rebuilding an
          # older scheduled-event snapshot after a delayed runner starts.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify isolated News tests
        run: npm run news:test && npm run news:schedule:test && npm run news:adaptive:test && npm run news:comparison:test
      - name: Verify saved free-tier credentials
        shell: bash
        run: |
          test -n "$EXA_API_KEY"
          test -n "$TAVILY_API_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Create isolated run workspace
        shell: bash
        run: mkdir -p "$RUN_ROOT"/{discovery,tavily-discovery,publisher,combined,selection,verification,repair,opportunity-repair,verified,gap/discovery,gap/selection,gap/verification,gap/repair,gap/opportunity-repair,gap/verified,merged,editorial/scored,writer/generated,final}
      - name: Discover fresh baseline candidates
        run: >-
          node experiments/news-global-discovery/exa-five-lane-scout.mjs
          --scan ${{ needs.plan.outputs.scan }} --hours ${{ needs.plan.outputs.window_hours }} --results-per-query 10 --max-queries 28
          --output ${{ env.RUN_ROOT }}/discovery/EXA_DISCOVERY.json
      - name: Collect publisher-feed safety net
        run: node experiments/news-global-discovery/source-seed-depth-scout.mjs --output-dir ${{ env.RUN_ROOT }}/publisher
      - name: Adaptively hunt for undercovered worthwhile stories
        run: >-
          node experiments/news-global-discovery/adaptive-research-scout.mjs
          --scan ${{ needs.plan.outputs.scan }}
          --hours ${{ needs.plan.outputs.window_hours }}
          --input ${{ env.RUN_ROOT }}/discovery/EXA_DISCOVERY.json
          --input ${{ env.RUN_ROOT }}/publisher/SOURCE_SEED_BATCH.json
          --output ${{ env.RUN_ROOT }}/tavily-discovery/TAVILY_DISCOVERY.json
      - name: Merge discovery sources
        run: >-
          node experiments/news-global-discovery/merge-discovery-candidates.mjs
          --exa ${{ env.RUN_ROOT }}/discovery/EXA_DISCOVERY.json
          --exa ${{ env.RUN_ROOT }}/tavily-discovery/TAVILY_DISCOVERY.json
          --source ${{ env.RUN_ROOT }}/publisher/SOURCE_SEED_BATCH.json
          --output ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json
      - name: Deduplicate, rank, and balance candidates
        run: >-
          node experiments/news-global-discovery/select-five-lane-edition.mjs
          --input ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json --count 240
          --output-dir ${{ env.RUN_ROOT }}/selection
      - name: Verify source evidence, freshness, event identity, and images
        run: >-
          node experiments/news-global-discovery/verify-unified-shortlist.mjs
          --input ${{ env.RUN_ROOT }}/selection/ANSWER_KEY.json
          --pool ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json
          --output-dir ${{ env.RUN_ROOT }}/verification
      - name: Attempt bounded source repair
        run: >-
          node experiments/news-global-discovery/repair-unified-shortlist.mjs
          --input ${{ env.RUN_ROOT }}/verification/VERIFICATION_REPORT.json
          --pool ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json --maximum 4 --provider tavily
          --output-dir ${{ env.RUN_ROOT }}/repair
      - name: Prepare strongest unresolved opportunities for a targeted second chance
        run: node experiments/news-global-discovery/prepare-opportunity-recovery.mjs --verification ${{ env.RUN_ROOT }}/verification/VERIFICATION_REPORT.json --repair ${{ env.RUN_ROOT }}/repair/SOURCE_REPAIR_REPORT.json --maximum 3 --output ${{ env.RUN_ROOT }}/opportunity-repair/OPPORTUNITY_QUEUE.json
      - name: Attempt blocker-specific opportunity recovery
        run: node experiments/news-global-discovery/repair-unified-shortlist.mjs --input ${{ env.RUN_ROOT }}/opportunity-repair/OPPORTUNITY_QUEUE.json --pool ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json --maximum 3 --provider exa --output-dir ${{ env.RUN_ROOT }}/opportunity-repair
      - name: Audit valuable stories that remain blocked
        run: node experiments/news-global-discovery/audit-blocked-opportunities.mjs --verification ${{ env.RUN_ROOT }}/verification/VERIFICATION_REPORT.json --repair ${{ env.RUN_ROOT }}/repair/SOURCE_REPAIR_REPORT.json --repair ${{ env.RUN_ROOT }}/opportunity-repair/SOURCE_REPAIR_REPORT.json --output-dir ${{ env.RUN_ROOT }}/opportunity-audit
      - name: Assemble source-ready provisional edition
        run: >-
          node experiments/news-global-discovery/assemble-verified-edition.mjs
          --shortlist ${{ env.RUN_ROOT }}/selection/ANSWER_KEY.json
          --verification ${{ env.RUN_ROOT }}/verification/VERIFICATION_REPORT.json
          --repair ${{ env.RUN_ROOT }}/repair/SOURCE_REPAIR_REPORT.json
          --repair ${{ env.RUN_ROOT }}/opportunity-repair/SOURCE_REPAIR_REPORT.json
          --output-dir ${{ env.RUN_ROOT }}/verified
      - name: Discover only for measured coverage gaps
        id: gap
        run: >-
          node experiments/news-global-discovery/exa-dynamic-gap-recovery.mjs
          --edition ${{ env.RUN_ROOT }}/verified/VERIFIED_EDITION.json
          --discovery ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json
          --results-per-query 10 --max-queries 8
          --output ${{ env.RUN_ROOT }}/gap/discovery/EXA_GAP_DISCOVERY.json
      - name: Select gap candidates
        if: steps.gap.outputs.query_count != '0'
        run: node experiments/news-global-discovery/select-five-lane-edition.mjs --input ${{ env.RUN_ROOT }}/gap/discovery/EXA_GAP_DISCOVERY.json --count 30 --output-dir ${{ env.RUN_ROOT }}/gap/selection
      - name: Verify gap candidates
        if: steps.gap.outputs.query_count != '0'
        run: node experiments/news-global-discovery/verify-unified-shortlist.mjs --input ${{ env.RUN_ROOT }}/gap/selection/ANSWER_KEY.json --pool ${{ env.RUN_ROOT }}/gap/discovery/EXA_GAP_DISCOVERY.json --output-dir ${{ env.RUN_ROOT }}/gap/verification
      - name: Repair strongest blocked gap candidates
        if: steps.gap.outputs.query_count != '0'
        run: node experiments/news-global-discovery/repair-unified-shortlist.mjs --input ${{ env.RUN_ROOT }}/gap/verification/VERIFICATION_REPORT.json --pool ${{ env.RUN_ROOT }}/gap/discovery/EXA_GAP_DISCOVERY.json --maximum 4 --provider tavily --output-dir ${{ env.RUN_ROOT }}/gap/repair
      - name: Prepare unresolved gap opportunities for a targeted second chance
        if: steps.gap.outputs.query_count != '0'
        run: node experiments/news-global-discovery/prepare-opportunity-recovery.mjs --verification ${{ env.RUN_ROOT }}/gap/verification/VERIFICATION_REPORT.json --repair ${{ env.RUN_ROOT }}/gap/repair/SOURCE_REPAIR_REPORT.json --maximum 3 --output ${{ env.RUN_ROOT }}/gap/opportunity-repair/OPPORTUNITY_QUEUE.json
      - name: Attempt blocker-specific gap opportunity recovery
        if: steps.gap.outputs.query_count != '0'
        run: node experiments/news-global-discovery/repair-unified-shortlist.mjs --input ${{ env.RUN_ROOT }}/gap/opportunity-repair/OPPORTUNITY_QUEUE.json --pool ${{ env.RUN_ROOT }}/gap/discovery/EXA_GAP_DISCOVERY.json --maximum 3 --provider exa --output-dir ${{ env.RUN_ROOT }}/gap/opportunity-repair
      - name: Audit valuable gap stories that remain blocked
        if: steps.gap.outputs.query_count != '0'
        run: node experiments/news-global-discovery/audit-blocked-opportunities.mjs --verification ${{ env.RUN_ROOT }}/gap/verification/VERIFICATION_REPORT.json --repair ${{ env.RUN_ROOT }}/gap/repair/SOURCE_REPAIR_REPORT.json --repair ${{ env.RUN_ROOT }}/gap/opportunity-repair/SOURCE_REPAIR_REPORT.json --output-dir ${{ env.RUN_ROOT }}/gap/opportunity-audit
      - name: Assemble verified gap additions
        if: steps.gap.outputs.query_count != '0'
        run: node experiments/news-global-discovery/assemble-verified-edition.mjs --shortlist ${{ env.RUN_ROOT }}/gap/selection/ANSWER_KEY.json --verification ${{ env.RUN_ROOT }}/gap/verification/VERIFICATION_REPORT.json --repair ${{ env.RUN_ROOT }}/gap/repair/SOURCE_REPAIR_REPORT.json --repair ${{ env.RUN_ROOT }}/gap/opportunity-repair/SOURCE_REPAIR_REPORT.json --output-dir ${{ env.RUN_ROOT }}/gap/verified
      - name: Merge verified baseline and gap editions
        if: steps.gap.outputs.query_count != '0'
        run: node experiments/news-global-discovery/merge-verified-editions.mjs --input ${{ env.RUN_ROOT }}/verified/VERIFIED_EDITION.json --input ${{ env.RUN_ROOT }}/gap/verified/VERIFIED_EDITION.json --output-dir ${{ env.RUN_ROOT }}/merged
      - name: Preserve verified baseline when no gaps exist
        if: steps.gap.outputs.query_count == '0'
        shell: bash
        run: cp "$RUN_ROOT/verified/VERIFIED_EDITION.json" "$RUN_ROOT/merged/MERGED_VERIFIED_EDITION.json"
      - name: Enforce recurring-free provider budget
        run: >-
          node experiments/news-global-discovery/audit-provider-budget.mjs
          --report ${{ env.RUN_ROOT }}/discovery/EXA_DISCOVERY.json
          --report ${{ env.RUN_ROOT }}/tavily-discovery/TAVILY_DISCOVERY.json
          --report ${{ env.RUN_ROOT }}/gap/discovery/EXA_GAP_DISCOVERY.json
          --report ${{ env.RUN_ROOT }}/repair/SOURCE_REPAIR_REPORT.json
          --report ${{ env.RUN_ROOT }}/opportunity-repair/SOURCE_REPAIR_REPORT.json
          --report ${{ env.RUN_ROOT }}/gap/repair/SOURCE_REPAIR_REPORT.json
          --report ${{ env.RUN_ROOT }}/gap/opportunity-repair/SOURCE_REPAIR_REPORT.json
          --output ${{ env.RUN_ROOT }}/PROVIDER_BUDGET.json
      - name: Prepare blind source-verified editorial fixture
        run: >-
          node experiments/news-global-discovery/editorial-selector.mjs
          --edition ${{ env.RUN_ROOT }}/merged/MERGED_VERIFIED_EDITION.json
          --prepare-fixture ${{ env.RUN_ROOT }}/editorial/EDITORIAL_FIXTURE.json
          --include-major --selected-only
      - name: Score every verified finalist under the product rubric
        shell: bash
        run: |
          scores="$RUN_ROOT/editorial/scored/EDITORIAL_SCORES.json"
          set +e
          node experiments/news-global-discovery/editorial-selector.mjs \
            --fixture "$RUN_ROOT/editorial/EDITORIAL_FIXTURE.json" \
            --output-dir "$RUN_ROOT/editorial/scored"
          status=$?
          for attempt in 2 3; do
            if [ "$status" -eq 0 ]; then break; fi
            echo "Editorial scoring incomplete; resuming validated batches (attempt $attempt of 3)."
            node experiments/news-global-discovery/editorial-selector.mjs \
              --fixture "$RUN_ROOT/editorial/EDITORIAL_FIXTURE.json" \
              --resume "$scores" \
              --output-dir "$RUN_ROOT/editorial/scored"
            status=$?
          done
          exit "$status"
      - name: Apply complete editorial scores without weakening evidence gates
        run: >-
          node experiments/news-global-discovery/apply-editorial-scores.mjs
          --edition ${{ env.RUN_ROOT }}/merged/MERGED_VERIFIED_EDITION.json
          --scores ${{ env.RUN_ROOT }}/editorial/scored/EDITORIAL_SCORES.json
          --output ${{ env.RUN_ROOT }}/editorial/EDITORIAL_VERIFIED_EDITION.json
      - name: Prepare source-bound writer batch
        run: node experiments/news-global-discovery/prepare-verified-writer-batch.mjs --input ${{ env.RUN_ROOT }}/editorial/EDITORIAL_VERIFIED_EDITION.json --output-dir ${{ env.RUN_ROOT }}/writer
      - name: Generate every verified finalist with deterministic checks
        run: node experiments/news-global-discovery/writer-shortlist-trial.mjs --shortlist ${{ env.RUN_ROOT }}/writer/WRITER_SHORTLIST.json --verification ${{ env.RUN_ROOT }}/writer/WRITER_VERIFICATION.json --all-selected --output-dir ${{ env.RUN_ROOT }}/writer/generated
      - name: Repair deterministic generation failures once
        run: node experiments/news-global-discovery/writer-shortlist-trial.mjs --shortlist ${{ env.RUN_ROOT }}/writer/WRITER_SHORTLIST.json --verification ${{ env.RUN_ROOT }}/writer/WRITER_VERIFICATION.json --all-selected --retry-rejected --output-dir ${{ env.RUN_ROOT }}/writer/generated
      - name: Assemble and audit the unattended shadow edition
        run: node experiments/news-global-discovery/assemble-unattended-shadow-edition.mjs --writer-report ${{ env.RUN_ROOT }}/writer/generated/TRIAL_REPORT.json --shortlist ${{ env.RUN_ROOT }}/writer/WRITER_SHORTLIST.json --output-dir ${{ env.RUN_ROOT }}/final
      - name: Score 24-hour daily-edition readiness
        run: node experiments/news-global-discovery/audit-daily-shadow-readiness.mjs --edition ${{ env.RUN_ROOT }}/final/UNATTENDED_SHADOW_EDITION.json --discovery ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json --budget ${{ env.RUN_ROOT }}/PROVIDER_BUDGET.json --output ${{ env.RUN_ROOT }}/DAILY_READINESS.json
      - name: Prepare blind independent-comparison prompt
        run: node experiments/news-global-discovery/build-blind-comparison-prompt.mjs --discovery ${{ env.RUN_ROOT }}/combined/COMBINED_DISCOVERY.json --output ${{ env.RUN_ROOT }}/CHATGPT_COMPARISON_PROMPT.txt
      - name: Diagnose coverage against the independent October 23 comparison
        run: >-
          node experiments/news-global-discovery/diagnose-editorial-benchmark.mjs
          --run ${{ env.RUN_ROOT }}
          --benchmark experiments/news-global-discovery/fixtures/oct-23-chatgpt-gap-benchmark.json
          --out ${{ env.RUN_ROOT }}/OCT23_CHATGPT_GAP_DIAGNOSIS.json
      - name: Upload complete evidence trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-unattended-shadow-${{ github.run_id }}
          path: ${{ env.RUN_ROOT }}
          retention-days: 14
          if-no-files-found: error
      - name: Convert only a release-ready edition
        if: needs.plan.outputs.publish == 'true'
        run: >-
          node scripts/news/promote-shadow-edition.mjs
          --input ${{ env.RUN_ROOT }}/final/UNATTENDED_SHADOW_EDITION.json
          --readiness ${{ env.RUN_ROOT }}/DAILY_READINESS.json
          --output public/news/beta-feed.json
          --control public/news/beta-control.json
          --mode ${{ needs.plan.outputs.edition_mode }}
          --base public/news/beta-feed.json
          --release-authorized
      - name: Validate hosted dataset schema
        if: needs.plan.outputs.publish == 'true'
        run: node scripts/news-beta/validate-news-beta.mjs public/news/beta-feed.json
      - name: Preserve the exact hosted edition
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name doomscroller-news-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/news/beta-feed.json public/news/beta-control.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish release-ready News daily edition"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  publish:
    needs: [plan, shadow]
    if: needs.plan.outputs.publish == 'true' && needs.shadow.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The shadow job commits with GITHUB_TOKEN. GitHub intentionally does not
      # emit another push workflow from that commit, so deploy the committed
      # edition inside this original run instead of relying on a second trigger.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the committed daily edition before deployment
        run: node scripts/news-beta/validate-news-beta.mjs public/news/beta-feed.json
      - name: Verify release control matches the committed edition
        shell: bash
        run: |
          node -e "const fs=require('fs');const feed=JSON.parse(fs.readFileSync('public/news/beta-feed.json'));const control=JSON.parse(fs.readFileSync('public/news/beta-control.json'));if(!control.enabled||control.datasetUrl!=='beta-feed.json'||control.updatedAt!==feed.generatedAt)process.exit(1)"
      - name: Stage stable News endpoints
        shell: bash
        run: |
          mkdir -p news-site/news
          cp public/news/feed.json news-site/news/feed.json
          cp public/news/beta-feed.json news-site/news/beta-feed.json
          cp public/news/beta-control.json news-site/news/beta-control.json
          printf '%s\n' '<!doctype html><title>Doomscroller News data</title><a href="news/feed.json">Stage 1 JSON</a> · <a href="news/beta-feed.json">Daily edition JSON</a>' > news-site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: news-site
      - name: Publish stable data files
        id: deployment
        uses: actions/deploy-pages@v4
