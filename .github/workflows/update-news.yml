name: Update and publish News data

on:
  workflow_dispatch:

concurrency:
  group: news-safe-writer-batch
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  generate-shadow-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
      BATCH_ROOT: experiments/news-global-discovery/fixtures/writer-batch-38301057429
      OUTPUT_ROOT: artifacts/news-safe-writer-batch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify isolated News tests
        run: npm run news:test
      - name: Verify saved Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Generate only source-and-image-cleared finalists
        id: generation
        continue-on-error: true
        run: >-
          node experiments/news-global-discovery/writer-shortlist-trial.mjs
          --shortlist $BATCH_ROOT/WRITER_SHORTLIST.json
          --verification $BATCH_ROOT/WRITER_VERIFICATION.json
          --all-selected
          --output-dir $OUTPUT_ROOT
      - name: Upload exact cards, progress and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-safe-writer-checkpoint-${{ github.run_id }}
          path: ${{ env.OUTPUT_ROOT }}
          retention-days: 30
          if-no-files-found: error
      - name: Preserve generation failure after uploading progress
        if: steps.generation.outcome == 'failure'
        shell: bash
        run: exit 1
