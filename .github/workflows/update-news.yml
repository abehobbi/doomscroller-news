name: Update and publish News data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
concurrency:
  group: doomscroller-news-update
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run news:update && npm run news:validate && npm run news:test
      - name: Keep the last good dataset for the next collection
        run: |
          git config user.name doomscroller-news-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/news/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update News dataset"
            git push
          fi
      - name: Stage only public News data (never the app)
        run: |
          mkdir -p news-site/news
          cp public/news/feed.json news-site/news/feed.json
          printf '%s\n' '<!doctype html><title>Doomscroller News data</title><a href="news/feed.json">News JSON</a>' > news-site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: news-site
      - name: Publish the dataset in this same run
        id: deployment
        uses: actions/deploy-pages@v4
