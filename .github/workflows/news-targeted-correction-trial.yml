name: Correct targeted News shadow cards

on:
  workflow_dispatch:

concurrency:
  group: news-targeted-correction-trial
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify isolated News tests
        run: npm run news:test
      - name: Verify saved Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Regenerate only corrected and replacement cards
        run: >-
          node experiments/news-global-discovery/writer-shortlist-trial.mjs
          --shortlist experiments/news-global-discovery/review-output-shadow-2026-10-11/shortlist-complete/WRITER_READY_SHORTLIST.json
          --verification experiments/news-global-discovery/review-output-shadow-2026-10-11/verification/TARGETED_VERIFICATION.json
          --verification experiments/news-global-discovery/review-output-shadow-2026-10-11/verification/GAP_RECOVERY_VERIFICATION.json
          --verification experiments/news-global-discovery/review-output-shadow-2026-10-11/verification/REGION_RECOVERY_VERIFICATION.json
          --event-id qualified-event-001
          --event-id qualified-event-078
          --event-id qualified-event-068
          --event-id qualified-event-024
          --event-id qualified-event-014
          --event-id qualified-event-042
          --event-id qualified-event-074
          --event-id qualified-event-025
          --event-id qualified-event-019
          --event-id qualified-event-008
          --output-dir experiments/news-global-discovery/review-output-shadow-2026-10-11/writing/corrected-targeted
      - name: Upload the correction review and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: news-targeted-correction-${{ github.run_id }}
          path: experiments/news-global-discovery/review-output-shadow-2026-10-11/writing/corrected-targeted
          retention-days: 14
          if-no-files-found: error
