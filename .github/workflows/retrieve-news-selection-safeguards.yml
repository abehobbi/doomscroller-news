name: Retrieve isolated News selection safeguards artifact

on:
  push:
    branches:
      - codex/news-editorial-selection
    paths:
      - .github/workflows/retrieve-news-selection-safeguards.yml

permissions:
  actions: read
  contents: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/news-editorial-selection
      - uses: actions/download-artifact@v5
        with:
          name: news-selection-safeguards-trial-38097120707
          path: experiments/news-global-discovery/review-output-five-lane/selection-safeguards-trial
          github-token: ${{ github.token }}
          run-id: 38097120707
      - name: Commit the safe review artifact to the feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f experiments/news-global-discovery/review-output-five-lane/selection-safeguards-trial
          git commit -m "Record isolated selection safeguard results"
          git push origin HEAD:codex/news-editorial-selection
