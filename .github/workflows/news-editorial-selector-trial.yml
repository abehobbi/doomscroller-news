name: Run fresh News shadow-edition selector

on:
  workflow_dispatch:

concurrency:
  group: news-editorial-selector-trial
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  score-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify saved Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Prepare the corrected selected-pool fixture
        run: >-
          node experiments/news-global-discovery/editorial-selector.mjs
          --edition experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/combined/COMBINED_QUALIFIED_EDITION.json
          --prepare-fixture experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/EDITORIAL_FIXTURE.json
          --selected-only
      - name: Score the corrected Interesting and Discovery candidates
        id: score
        continue-on-error: true
        run: >-
          node experiments/news-global-discovery/editorial-selector.mjs
          --fixture experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/EDITORIAL_FIXTURE.json
          --output-dir experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/scored
      - name: Upload blind review, answer key and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shadow-editorial-selector-${{ github.run_id }}
          path: experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/scored
          retention-days: 30
          if-no-files-found: error
      - name: Preserve a failed selector result as a failed workflow
        if: steps.score.outcome == 'failure'
        run: exit 1
