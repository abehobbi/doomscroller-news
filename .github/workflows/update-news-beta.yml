name: Update isolated News beta
on:
  workflow_dispatch:
  schedule:
    # Check at roughly 06:23 and 18:23 Toronto time during daylight saving.
    # Each run keeps the rolling feed; it does not manufacture 20-30 new cards.
    - cron: '23 10,22 * * *'
concurrency:
  group: doomscroller-news-update
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
      NEWS_BETA_DIAGNOSTICS_DIR: diagnostics/news-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify free inference configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Discover, generate, validate, and retain the last good cards
        run: npm run news:beta:update
      - run: npm run news:beta:validate
      - run: npm run news:test
      - name: Preserve beta dataset and batch diagnostics
        shell: bash
        run: |
          git config user.name doomscroller-news-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/news/beta-feed.json public/news/beta-control.json diagnostics/news-beta
          if ! git diff --cached --quiet; then
            git commit -m "Update isolated News beta dataset"
            git push
          fi
      - name: Stage both preserved Stage 1 and isolated beta data
        shell: bash
        run: |
          mkdir -p news-site/news
          cp public/news/feed.json news-site/news/feed.json
          cp public/news/beta-feed.json news-site/news/beta-feed.json
          cp public/news/beta-control.json news-site/news/beta-control.json
          printf '%s\n' '<!doctype html><title>Doomscroller News data</title><a href="news/feed.json">Stage 1 JSON</a> · <a href="news/beta-feed.json">Isolated beta JSON</a>' > news-site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: news-site
      - name: Publish isolated data files
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Retain exact batch diagnostics as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-beta-diagnostics-${{ github.run_id }}
          path: diagnostics/news-beta
          retention-days: 30
