name: Score targeted News recall candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify saved Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Prepare source-ready recall edition
        run: >-
          node experiments/news-global-discovery/prepare-recall-editorial-edition.mjs
          --qualified experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/qualified/QUALIFIED_EDITION.json
          --verification experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/verified/VERIFICATION_REPORT.json
          --repair experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/repaired/SOURCE_REPAIR_REPORT.json
          --output experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/editorial/READY_EDITION.json
      - name: Prepare blind 32-versus-13 editorial fixture
        run: >-
          node experiments/news-global-discovery/prepare-recall-head-to-head.mjs
          --baseline experiments/news-global-discovery/review-output-edition-2026-10-12/VERIFIED_EDITION.json
          --recall experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/editorial/READY_EDITION.json
          --output experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/editorial/HEAD_TO_HEAD_FIXTURE.json
      - name: Score all 45 candidates under one rubric
        id: score
        continue-on-error: true
        run: >-
          node experiments/news-global-discovery/editorial-selector.mjs
          --fixture experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/editorial/HEAD_TO_HEAD_FIXTURE.json
          --output-dir experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/editorial/scored
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-recall-editorial-${{ github.run_id }}
          path: experiments/news-global-discovery/review-output-targeted-recall-2026-10-12/editorial
          retention-days: 30
          if-no-files-found: error
      - name: Preserve selector failure
        if: steps.score.outcome == 'failure'
        run: exit 1
