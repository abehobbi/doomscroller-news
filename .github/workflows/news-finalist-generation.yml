name: Generate source-cleared News finalist cards

on:
  workflow_dispatch:

concurrency:
  group: news-finalist-generation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-finalists:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FREE_PLAN_CONFIRMED: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify News tests
        run: npm run news:test
      - name: Verify saved Cloudflare credentials are available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Generate only source-and-image-cleared finalists
        run: >-
          node experiments/news-global-discovery/writer-shortlist-trial.mjs
          --shortlist experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/readiness/GENERATION_READY_SHORTLIST.json
          --verification experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/readiness/SOURCE_VERIFICATION_MERGED.json
          --all-selected
          --output-dir experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/generated-cards
      - name: Upload exact cards and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: news-finalist-cards-${{ github.run_id }}
          path: experiments/news-global-discovery/review-output-shadow-2026-10-11-expanded/final-selection/generated-cards
          retention-days: 14
          if-no-files-found: error
